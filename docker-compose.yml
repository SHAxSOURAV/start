services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # Inside the compose network the DB host is the service name
      MONGO_URL: mongodb://mongo:27017/templateDB
      REDIS_URL: redis://redis:6379/0
      BASE_URL: 0.0.0.0
      PORT: 8001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
  uploads:
  logs:
