[project]
name = "server-setup-template"
version = "1.0.0"
description = "FastAPI + Beanie + MongoDB backend starter template"
authors = [{ name = "SHAxSOURAV" }]
license = { text = "ISC" }
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.129.1",
    "uvicorn[standard]>=0.54.0",
    "beanie>=2.2.0",
    "pymongo>=4.19.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "email-validator>=2.3.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.32",
    "python-socketio>=5.17.0",
    "aiosmtplib>=5.1.3",
    "apscheduler>=3.11.3",
    "stripe>=16.0.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260905",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260905",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
