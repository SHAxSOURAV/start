# ==============================================================================
# Production Redis Configuration (10 Golden Rules Aligned)
# ==============================================================================

# Network & Ports
port 6379
bind 0.0.0.0
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Rule 1: Memory Management & Eviction Policy
maxmemory 256mb
# volatile-ttl: Evicts keys with an expire set of the shortest TTL first
maxmemory-policy volatile-ttl
maxmemory-samples 5

# Rule 4: Non-blocking background memory freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Rule 5: Data Persistence (Hybrid RDB + AOF)
# RDB Snapshots: save after 300 sec if at least 10 keys changed, or 60 sec if 10000 keys changed
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) Logging
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Logging & Performance
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128
