name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Import check
        env:
          MONGO_URL: mongodb://localhost:27017/templateDB
          JWT_SECRET: ci-secret-value-that-is-long-enough-to-pass-validation
          JWT_REFRESH_SECRET: ci-refresh-secret-value-that-is-long-enough-too
        run: python -c "import src.connection.socket"
